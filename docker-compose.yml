services:
  postgres:
    image: postgres:17-alpine
    container_name: jpa-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-demo_db}
      POSTGRES_USER: ${DB_USER:-demo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-demo_pass}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-demo_user} -d ${DB_NAME:-demo_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional web UI to browse tables (handy for showing the audit columns live)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jpa-demo-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@demo.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
