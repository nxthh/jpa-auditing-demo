plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Spring Data JPA: Auditing + Specification live demo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Lombok must be new enough to run on JDK 25
ext['lombok.version'] = '1.18.42'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // JPA Auditing + Specification live here
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13' // Swagger UI
    runtimeOnly 'org.postgresql:postgresql'                                 // PostgreSQL driver
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'   // auto-runs docker-compose.yml on bootRun

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    enabled = false // only build the executable boot jar
}
