spring:
  application:
    name: jpa-auditing-specification-demo

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:demo_db}
    username: ${DB_USER:demo_user}
    password: ${DB_PASSWORD:demo_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update        # keeps data between restarts (volume is persistent)
    properties:
      hibernate:
        format_sql: true
    show-sql: true            # watch the generated SQL during the live demo

  docker:
    compose:
      file: docker-compose.yml
      lifecycle-management: start_only   # start Postgres on bootRun, leave it running afterwards
      skip:
        in-tests: false                  # also start/use the Docker Postgres when running tests

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
